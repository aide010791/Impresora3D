<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/estilos.css">
	<link rel="icon" type="image/png" href="https://aide010791.github.io/BioingenieriaNew/css/favicon.png">
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<title>Registro de uso Impresora 3D</title>
</head>
<body>
	<div class="contenedor">
		<div class="columna-izquierda">
			<div class="registro activo" id="registro">
				<div class="header">
					<h1>Registro de uso Impresora 3D</h1>
					<p class="subtitulo">Impresión con filamento — Lab Bioingeniería</p>
				</div>

				<form class="formulario" id="formulario" novalidate>
					<div class="input-group">
						<label for="fecha">Fecha: <input type="date" id="fecha" name="fecha" required></label>
					</div>

					<div class="input-group">
						<label for="nombre">Nombre: <input type="text" id="nombre" name="nombre" maxlength="120" required></label>
					</div>

					<div class="input-group">
						<label for="boleta">No. de Boleta: <input type="text" id="boleta" name="boleta" inputmode="numeric" maxlength="20" required></label>
					</div>

					<div class="input-group">
						<label for="materia">Materia: <input type="text" id="materia" name="materia" maxlength="120" placeholder="Escribe para ver sugerencias" required></label>
					</div>

					<div class="input-group">
						<label for="profesor">Profesor: <input type="text" id="profesor" name="profesor" maxlength="120" required></label>
					</div>

					<div class="input-group">
						<label for="piezas">Cantidad de piezas:
							<select id="piezas" name="piezas" required></select>
						</label>
					</div>

					<div class="input-group">
						<span class="etiqueta">Tiempo de impresión:</span>
						<div class="fila-doble">
							<label for="horas" class="sub">Horas
								<input type="number" id="horas" name="horas" min="0" max="168" step="1" value="0" inputmode="numeric" required>
							</label>
							<label for="minutos" class="sub">Minutos
								<input type="number" id="minutos" name="minutos" min="0" max="59" step="1" value="0" inputmode="numeric" required>
							</label>
						</div>
					</div>

					<div class="input-group">
						<span class="etiqueta">Filamento utilizado:</span>
						<div class="fila-doble">
							<label for="filamento" class="sub">Tipo
								<select id="filamento" name="filamento" required>
									<option value="PLA">PLA</option>
									<option value="PETG">PETG</option>
									<option value="ABS">ABS</option>
									<option value="TPU">TPU</option>
									<option value="Otro">Otro</option>
								</select>
							</label>
							<label for="gramos" class="sub">Gramos
								<input type="number" id="gramos" name="gramos" min="0.1" max="5000" step="0.1" inputmode="decimal" placeholder="Ej. 35" required>
							</label>
						</div>
					</div>

					<p class="mensaje-error" id="mensaje-error" role="alert"></p>

					<button type="submit" id="btn-registro">REGISTRO</button>
				</form>
			</div>

			<div class="header exito" id="exito">
				<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
					<path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
					<path d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z"/>
				</svg>
				<h1>¡Registrado correctamente!</h1>
				<p class="resumen" id="resumen"></p>
				<button type="button" id="btn-otra">Registrar otra impresión</button>
			</div>
		</div>

		<div class="columna-derecha"></div>
	</div>

	<!-- Catálogo de materias/profesores y autocompletado (compartidos con el registro del Lab) -->
	<script src="https://aide010791.github.io/BioingenieriaNew/js/catalogo.js"></script>
	<script src="https://aide010791.github.io/BioingenieriaNew/js/autocompletar.js"></script>
	<script src="js/app.js"></script>
</body>
</html>
